description: |
  Lightweight state machine enforcing MetaRSI-v1's H→D→M traffic rule (禁止 H→M 直跳).
  Implements 3+1 conditions evaluate_readiness matrix (per Oracle review correction:
  condition 1 attribution Attributed is sufficient, condition 4 "no uncontrolled confounder"
  is embedded in condition 1 algorithm per ADR-0086 v1.1 decision 2 — not an independent gate).

  Key design decisions (post dual-agent review bg_ba048665 + bg_fed9d7c0):
  1. cancel 3-operator interface (IDataRSI/IHarnessRSI/IModelRSI) per Oracle M2 (YAGNI)
  2. Reuse existing contract stack (ADR-0083/0084/0086 v1.1/IBudgetController/IGenomeRegistry)
  3. fail-closed default when ADR-0086 unavailable (no degraded-skip mode)
  4. compile-time constexpr literal type bool (not EvolutionVerdict which is non-literal)
  5. extension IGenomeRegistry::walk_ancestors with name parameter (per-name versioning)
  6. LineageWalk.intermediate_metadata must be vector<Genome> (for spec.harness comparison)
  7. GenomeVersion struct owned by ADR-0086 v1.1 attribution_record.h (avoid ODR violation)
  8. register 2 new evolution.* event topics in ADR-0068 Appendix A (no phantom topics)

  Predecessor: docs/research/rsi-three-operators-hydraforge-mapping-2026-09.md
